sonar.links.ci=https://github.com/rdkcentral/parodus2ccsp/actions
sonar.links.scm=https://github.com/rdkcentral/parodus2ccsp
sonar.links.issue=https://github.com/rdkcentral/parodus2ccsp/issues

# =====================================================
#   Properties specific to C
# =====================================================
sonar.cfamily.build-wrapper-output=build/bw-output
sonar.cfamily.threads=2
sonar.cfamily.cache.enabled=false
sonar.coverageReportPaths=build/coverage.xml

