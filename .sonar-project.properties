# =====================================================
#   Standard properties
# =====================================================

sonar.organization=rdkcentral
sonar.projectKey=rdkcentral_parodus2ccsp
sonar.projectName=parodus2ccsp

sonar.sources=source

# =====================================================
#   Meta-data for the project
# =====================================================

